name: npm release

# Publishes every @atlasauth package whose version is not on npm yet, after the
# monorepo sync lands a version bump. New versions go out under `next`, and
# `latest` moves only once every new tarball is downloadable, so `latest`
# never points at a package whose dependency is not published yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance: the publish signs a statement that this workflow, at this commit, built the package.
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Plan
        id: plan
        run: |
          names=$(node .github/scripts/release-plan.mjs)
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "To publish: ${names:-nothing}"

      - name: Install
        if: steps.plan.outputs.names != ''
        run: pnpm install --frozen-lockfile

      - name: Build (the new packages and what they depend on)
        if: steps.plan.outputs.names != ''
        run: |
          args=(); for n in ${{ steps.plan.outputs.names }}; do args+=(--filter "$n..."); done
          pnpm -r "${args[@]}" build

      - name: Publish
        if: steps.plan.outputs.names != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Straight to latest, in dependency order (pnpm -r publishes dependencies first). npm serves a new version
          # once it has processed it; parking it under next first only delayed latest by that same processing time.
          args=(); for n in ${{ steps.plan.outputs.names }}; do args+=(--filter "$n"); done
          pnpm -r "${args[@]}" publish --access public --no-git-checks --tag latest

      - name: Check the tarballs are served
        if: steps.plan.outputs.names != ''
        run: |
          # Informational: every tarball polled together, 10 minutes at most; a slow registry is a warning, not a failed release.
          check() {
            dir=$(grep -l "\"name\": \"$1\"" packages/*/package.json | head -1 | xargs dirname)
            v=$(node -p "require('./$dir/package.json').version")
            t="https://registry.npmjs.org/$1/-/${1##*/}-$v.tgz"
            for _ in $(seq 1 60); do curl -sfI "$t" >/dev/null && { echo "served: $1@$v"; return; }; sleep 10; done
            echo "::warning::$1@$v is published but npm had not served its tarball after 10 minutes"
          }
          for n in ${{ steps.plan.outputs.names }}; do check "$n" & done
          wait

      - name: Fail if a version was held back
        if: always()
        run: |
          # Set by the plan: a version its CHANGELOG.md does not describe was not published.
          if [ -f .release-held ]; then cat .release-held; exit 1; fi
