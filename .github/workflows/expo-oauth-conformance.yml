# Copy to .github/workflows/expo-oauth-conformance.yml in the public javascript repository
# (Atlas-Authorization/javascript) and copy this folder (without this file) to .github/conformance/expo-oauth-conformance/
# there: the mirror sync keeps its own .github and replaces everything else with packages/, so neither is carried.
# Secrets: ATLAS_DEV_PK (publishable key of a DEVELOPMENT instance that has the built-in atlas_test provider
# enabled (PUT /v1/oauth_providers/atlas_test {enabled:true}) and the native app com.example.app registered with callback exampleapp://atlas-oauth), ATLAS_DEV_FAPI (its
# Frontend API URL). Optional: ATLAS_DEV_NATIVE_APP_ID, ATLAS_DEV_TEST_PROVIDER.
name: expo-oauth-conformance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/expo/**', 'packages/react-native/**', 'packages/js/**']
  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: expo-oauth-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_ATLAS_DEV_PK: ${{ secrets.ATLAS_DEV_PK }}
  EXPO_PUBLIC_ATLAS_DEV_FAPI: ${{ secrets.ATLAS_DEV_FAPI }}
  EXPO_PUBLIC_ATLAS_NATIVE_APP_ID: ${{ secrets.ATLAS_DEV_NATIVE_APP_ID }}
  EXPO_PUBLIC_ATLAS_TEST_PROVIDER: ${{ secrets.ATLAS_DEV_TEST_PROVIDER }}

jobs:
  # The app is built from the packages in this repository, so the run tests the code about to be released.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "@atlasauth/expo..." build
      - name: Prepare the example app
        run: |
          mkdir -p "$RUNNER_TEMP/app" && cp -R .github/conformance/expo-oauth-conformance/. "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          # use the packages built above instead of the published ones (pack rewrites workspace:* to versions)
          (cd "$GITHUB_WORKSPACE" && pnpm --filter "@atlasauth/expo..." -r exec pnpm pack --pack-destination "$RUNNER_TEMP/tgz")
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tgz/*.tgz
          # the React Native and Expo module versions that match this Expo SDK
          npx expo install react react-native expo-constants expo-linking expo-secure-store expo-web-browser expo-crypto
          # Expo's bundler reads .env in every build phase (Xcode's bundling script does not always see the job env).
          env | grep '^EXPO_PUBLIC_' > .env || true
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Conformance.xcworkspace -scheme Conformance -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Reach the Frontend API from the runner
        run: curl -sS -o /dev/null -w 'runner -> Frontend API: %{http_code} via %{remote_ip} (%{ssl_verify_result})\n' "$EXPO_PUBLIC_ATLAS_DEV_FAPI/v1/environment" -H "x-publishable-key: $EXPO_PUBLIC_ATLAS_DEV_PK" || true
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "$RUNNER_TEMP"/app/build/Build/Products/Release-iphonesimulator/Conformance.app
      - name: Run the flow
        run: |
          maestro test .github/conformance/expo-oauth-conformance/maestro/ios.yaml --format junit --output ios-report.xml || {
            xcrun simctl spawn booted log show --last 5m --predicate 'process == "Conformance"' > ios-device.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-report, path: "ios-report.xml\nios-device.log\n~/.maestro/tests" }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "@atlasauth/expo..." build
      - name: Prepare the example app
        run: |
          mkdir -p "$RUNNER_TEMP/app" && cp -R .github/conformance/expo-oauth-conformance/. "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          (cd "$GITHUB_WORKSPACE" && pnpm --filter "@atlasauth/expo..." -r exec pnpm pack --pack-destination "$RUNNER_TEMP/tgz")
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tgz/*.tgz
          # the React Native and Expo module versions that match this Expo SDK
          npx expo install react react-native expo-constants expo-linking expo-secure-store expo-web-browser expo-crypto
          # Expo's bundler reads .env in every build phase (Xcode's bundling script does not always see the job env).
          env | grep '^EXPO_PUBLIC_' > .env || true
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease -x lint)
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install "$RUNNER_TEMP"/app/android/app/build/outputs/apk/release/app-release.apk
            maestro test .github/conformance/expo-oauth-conformance/maestro/android.yaml --format junit --output android-report.xml || (adb logcat -d > android-logcat.txt; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-report, path: "android-report.xml\nandroid-logcat.txt\n~/.maestro/tests" }
